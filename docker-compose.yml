version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: pdf_chatbot_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: pdf_chatbot_streamlit

    ports:
      - "8501:8501"

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      - api

    restart: unless-stopped
